[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cx123323-refusal_boundary_ratio_calc"
version = "0.1.0"
description = "从输入中抽取数值，计算特征平台工程师·拒答边界与过度拒答相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cx123323" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cx123323.github.io"
Repository = "https://github.com/cx123323/refusal_boundary_ratio_calc"
Issues = "https://github.com/cx123323/refusal_boundary_ratio_calc/issues"

[project.scripts]
refusal_boundary_ratio_calc = "refusal_boundary_ratio_calc:main"

[tool.setuptools]
py-modules = ["refusal_boundary_ratio_calc"]
